<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Dark background with rounded corners -->
  <rect width="512" height="512" rx="110" fill="#0a0a0f"/>

  <!-- Water drop body -->
  <path d="M256 100 C256 100 148 240 148 316 C148 374 196 420 256 420 C316 420 364 374 364 316 C364 240 256 100 256 100Z"
        fill="url(#dropGrad)"/>

  <!-- Water level fill inside drop (lighter area at bottom) -->
  <clipPath id="dropClip">
    <path d="M256 100 C256 100 148 240 148 316 C148 374 196 420 256 420 C316 420 364 374 364 316 C364 240 256 100 256 100Z"/>
  </clipPath>
  <rect x="120" y="330" width="280" height="110" fill="url(#fillGrad)" clip-path="url(#dropClip)" opacity="0.5"/>

  <!-- Clock hands inside drop -->
  <circle cx="256" cy="310" r="4" fill="white" opacity="0.9"/>
  <!-- Hour hand -->
  <line x1="256" y1="310" x2="256" y2="272" stroke="white" stroke-width="10" stroke-linecap="round" opacity="0.9"/>
  <!-- Minute hand -->
  <line x1="256" y1="310" x2="290" y2="320" stroke="white" stroke-width="7" stroke-linecap="round" opacity="0.75"/>

  <defs>
    <linearGradient id="dropGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="fillGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#93c5fd"/>
      <stop offset="100%" stop-color="#bfdbfe"/>
    </linearGradient>
  </defs>
</svg>
